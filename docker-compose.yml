services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: geodispatch_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB:       geodispatch
      POSTGRES_USER:     geodispatch_user
      POSTGRES_PASSWORD: geodispatch_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_events.sql:/docker-entrypoint-initdb.d/002_events.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geodispatch_user -d geodispatch_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geodispatch_supervisor
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    env_file:
      - .env

    # Makes host.docker.internal resolve correctly on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data: